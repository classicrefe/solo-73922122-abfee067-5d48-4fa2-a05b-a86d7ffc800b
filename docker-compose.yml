services:
  privilege-audit:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-privilege-audit:local
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      TMPDIR: /tmp
      SCAN_TMP_DIR: /tmp
      # Two shared compute slots for upload scans and the built-in demo.
      SCAN_MAX_SLOTS: "2"
      # A scan that does not finish within 3s of acquiring a slot is killed.
      SCAN_TIMEOUT_SECONDS: "3"
      # Diagnostic hook (0 = disabled). Set e.g. "10" to demo timeouts.
      SCAN_WORKER_DELAY_SECONDS: "0"
    read_only: true
    tmpfs:
      - "/tmp:size=${UPLOAD_TMP_SIZE:-512m},mode=1777"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
